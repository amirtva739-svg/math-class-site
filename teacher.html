<!doctype html><html lang="fa"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پنل معلم</title><link rel="stylesheet" href="/style.css"></head><body><div class="wrap"><div class="top"><div><div class="brand">پنل معلم</div><div class="muted">ساخت آزمون ضرب پایه چهارم</div></div><a class="btn secondary" href="/student">مشاهده لینک دانش‌آموز</a></div><div class="card"><div class="grid"><div class="field"><label>عنوان آزمون</label><input id="title" value="آزمون ضرب پایه چهارم"></div><div class="field"><label>مدت آزمون (دقیقه)</label><input id="minutes" type="number" min="1" value="10"></div></div><div class="field"><label>شروع آزمون</label><input id="start" type="datetime-local"></div><div class="field"><label>سؤال‌ها</label><div id="qs" class="questions"></div></div><div class="row"><button class="btn" onclick="addQ()">+ افزودن سؤال</button><button class="btn" onclick="saveQuiz()">انتشار آزمون</button></div></div><div id="published" class="card hidden"></div><div class="card"><h3>پاسخ‌های دانش‌آموزان</h3><div id="results" class="muted">هنوز نتیجه‌ای ثبت نشده است.</div></div></div><script>
let questions=[]; function addQ(a=2,b=3){questions.push({a,b});render();} function render(){qs.innerHTML=questions.map((q,i)=>`<div class="q"><strong>سؤال ${i+1}</strong><div class="answers"><input type="number" value="${q.a}" onchange="questions[${i}].a=+this.value"><input type="number" value="${q.b}" onchange="questions[${i}].b=+this.value"></div><div class="row" style="margin-top:8px"><span class="muted">${q.a} × ${q.b} = ؟</span><button class="btn secondary" onclick="questions.splice(${i},1);render()">حذف</button></div></div>`).join('')} for(let i=0;i<8;i++)addQ(Math.floor(Math.random()*8)+2,Math.floor(Math.random()*8)+2);
async function saveQuiz(){const start=document.getElementById('start').value||new Date().toISOString().slice(0,16); const quiz={id:Date.now().toString(36),title:title.value,minutes:+minutes.value,start,questions}; await fetch('/api/quiz',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(quiz)});published.classList.remove('hidden');published.innerHTML=`<div class="pill">آزمون منتشر شد</div><p>لینک دانش‌آموز: <b>${location.origin}/student</b></p><p class="muted">دانش‌آموز باید نام خود را وارد کند و در زمان تعیین‌شده پاسخ دهد.</p>`; loadResults();}
async function loadResults(){const d=await (await fetch('/api/results')).json();if(!d.answers.length){results.innerHTML='هنوز نتیجه‌ای ثبت نشده است.';return} results.innerHTML='<table class="table"><tr><th>دانش‌آموز</th><th>نمره</th><th>زمان ثبت</th></tr>'+d.answers.map(a=>`<tr><td>${a.name}</td><td>${a.score}/${d.quiz.questions.length}</td><td>${new Date(a.submittedAt).toLocaleString('fa-IR')}</td></tr>`).join('')+'</table>'} loadResults();setInterval(loadResults,3000);
</script></body></html>
