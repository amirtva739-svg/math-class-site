<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پنل معلم | کلاس ضرب</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f4f6fb;color:#172033}header{background:#fff;border-bottom:1px solid #e6e9f0;padding:18px 28px;display:flex;justify-content:space-between;align-items:center}.logo{font-size:22px;font-weight:800}.badge{background:#eef2ff;color:#4054c6;padding:7px 12px;border-radius:20px;font-size:13px}.wrap{max-width:1180px;margin:28px auto;padding:0 18px}h1{margin:0 0 7px;font-size:30px}.sub{margin:0;color:#667085}.grid{display:grid;grid-template-columns:1.05fr .95fr;gap:18px;margin-top:22px}.card{background:#fff;border:1px solid #e7eaf0;border-radius:18px;padding:22px;margin-bottom:18px;box-shadow:0 5px 18px #16213d0b}.card h2{margin-top:0;font-size:20px}label{display:block;font-weight:700;margin:12px 0 6px}input,select{width:100%;padding:12px;border:1px solid #d8dce6;border-radius:10px;font-size:16px}button{border:0;border-radius:10px;padding:11px 15px;cursor:pointer;font-weight:700;font-size:15px}.primary{background:#4054c6;color:#fff}.secondary{background:#edf0f7}.danger{background:#fff0f0;color:#b42318}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.question-list{display:grid;gap:10px;margin-top:14px}.q{border:1px solid #e3e7ef;border-radius:13px;padding:14px;background:#fafbfe}.qtop{display:flex;justify-content:space-between;align-items:center}.qinputs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:10px}.status{display:inline-block;padding:6px 10px;border-radius:20px;font-size:12px;font-weight:700}.green{background:#e7f7ed;color:#16834a}.yellow{background:#fff3d9;color:#9a6500}.gray{background:#eef1f5;color:#667085}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#f7f8fc;border-radius:12px;padding:14px;text-align:center}.stat b{display:block;font-size:23px}.link{direction:ltr;text-align:left;word-break:break-all;background:#f7f8fc;border:1px dashed #cfd5e1;border-radius:10px;padding:12px}.msg{display:none;margin-top:12px;padding:11px;border-radius:10px}.ok{background:#eef8f1;color:#16834a}.err{background:#fff1f1;color:#b42318}.empty{text-align:center;color:#667085;padding:22px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:600px}th,td{padding:10px;border-bottom:1px solid #edf0f4;text-align:right}th{background:#f7f8fc}.small{font-size:12px;color:#667085}@media(max-width:850px){.grid{grid-template-columns:1fr}.row,.qinputs{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}}
</style></head><body><header><div class="logo">کلاس ضرب</div><div class="badge">پنل معلم | پایه چهارم</div></header><div class="wrap"><h1>مدیریت آزمون</h1><p class="sub">آزمون ضرب را بساز، زمان‌بندی کن و نتیجه دانش‌آموزان را ببین.</p><div class="grid"><main>
<section class="card"><h2>مشخصات آزمون</h2><label>عنوان آزمون</label><input id="title" value="آزمون ضرب پایه چهارم"><div class="row"><div><label>زمان شروع</label><input id="start" type="datetime-local"><div class="small">خالی = شروع فوری</div></div><div><label>مدت آزمون (دقیقه)</label><input id="duration" type="number" min="1" max="180" value="15"></div></div><div class="actions"><button class="primary" onclick="publish()">ذخیره و انتشار</button><button class="secondary" onclick="generate(10)">ساخت ۱۰ سؤال</button><button class="secondary" onclick="add()">افزودن سؤال</button></div><div id="msg" class="msg"></div></section>
<section class="card"><h2>سؤال‌های آزمون</h2><div id="questions"></div></section>
</main><aside>
<section class="card"><h2>آزمون فعلی</h2><div id="state"><span class="status gray">در حال بارگذاری</span></div><p id="info" class="small"></p><label>لینک دانش‌آموز</label><div id="studentLink" class="link">پس از انتشار نمایش داده می‌شود.</div><div class="actions"><button class="primary" onclick="copyLink()">کپی لینک</button><button class="secondary" onclick="refresh()">به‌روزرسانی</button></div></section>
<section class="card"><h2>نتایج</h2><div class="stats"><div class="stat"><b id="n">۰</b>پاسخ</div><div class="stat"><b id="avg">۰٪</b>میانگین</div><div class="stat"><b id="best">۰٪</b>بیشترین</div></div><div id="results" class="tablewrap" style="margin-top:14px"></div></section>
</aside></div></div><script>
let qs=[];let answers=[];let quiz=null;
const fa=x=>String(x).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function msg(t,ok=true){let e=document.getElementById('msg');e.textContent=t;e.className='msg '+(ok?'ok':'err');e.style.display='block';setTimeout(()=>e.style.display='none',3500)}
function generate(n){qs=[];let used=new Set();while(qs.length<n){let a=Math.floor(Math.random()*9)+2,b=Math.floor(Math.random()*9)+2,k=a+'x'+b;if(used.has(k))continue;used.add(k);qs.push({a,b,answer:a*b})}renderQs();msg('سؤال‌های جدید ساخته شدند.')}
function add(){let a=3,b=7;qs.push({a,b,answer:a*b});renderQs()}
function remove(i){if(qs.length<=1)return msg('حداقل یک سؤال لازم است.',false);qs.splice(i,1);renderQs()}
function update(i,k,v){qs[i][k]=Number(v)}
function renderQs(){let box=document.getElementById('questions');if(!qs.length){box.innerHTML='<div class="empty">هنوز سؤالی ندارید. روی «ساخت ۱۰ سؤال» بزن.</div>';return}box.innerHTML=qs.map((q,i)=>`<div class="q"><div class="qtop"><b>سؤال ${fa(i+1)}</b><button class="danger" onclick="remove(${i})">حذف</button></div><div class="qinputs"><div><label>عدد اول</label><input type="number" value="${q.a}" onchange="update(${i},'a',this.value)"></div><div><label>عدد دوم</label><input type="number" value="${q.b}" onchange="update(${i},'b',this.value)"></div><div><label>پاسخ صحیح</label><input type="number" value="${q.answer}" onchange="update(${i},'answer',this.value)"></div></div></div>`).join('')}
function payload(){let raw=document.getElementById('start').value;return{title:document.getElementById('title').value.trim()||'آزمون ضرب پایه چهارم',durationMinutes:Number(document.getElementById('duration').value)||15,startAt:raw?new Date(raw).toISOString():null,questions:qs,publishedAt:new Date().toISOString()}}
async function publish(){if(!qs.length)return msg('اول سؤال بساز.',false);try{let r=await fetch('/api/quiz',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload())});if(!r.ok)throw 0;quiz=await r.json();msg('آزمون با موفقیت منتشر شد.');renderQuiz();await results()}catch(e){msg('ذخیره آزمون انجام نشد.',false)}}
function renderQuiz(){if(!quiz){document.getElementById('state').innerHTML='<span class="status gray">آزمونی منتشر نشده</span>';document.getElementById('info').textContent='';document.getElementById('studentLink').textContent='پس از انتشار نمایش داده می‌شود.';return}let start=quiz.startAt?new Date(quiz.startAt):null;let end=start?new Date(start.getTime()+Number(quiz.durationMinutes||15)*60000):null;let now=new Date();let text=start&&now<start?'زمان‌بندی شده':end&&now>end?'پایان‌یافته':'فعال';let cls=text==='فعال'?'green':text==='زمان‌بندی شده'?'yellow':'gray';document.getElementById('state').innerHTML='<span class="status '+cls+'">'+text+'</span>';document.getElementById('info').innerHTML='عنوان: <b>'+esc(quiz.title)+'</b><br>تعداد سؤال: '+fa(quiz.questions?.length||0)+'<br>مدت: '+fa(quiz.durationMinutes||15)+' دقیقه<br>شروع: '+(start?start.toLocaleString('fa-IR'):'فوری');document.getElementById('studentLink').textContent=location.origin+'/student'}
async function loadQuiz(){try{let r=await fetch('/api/quiz',{cache:'no-store'});quiz=await r.json();if(quiz&&quiz.questions){qs=quiz.questions;document.getElementById('title').value=quiz.title||'';document.getElementById('duration').value=quiz.durationMinutes||15;if(quiz.startAt){let d=new Date(quiz.startAt);d=new Date(d.getTime()-d.getTimezoneOffset()*60000);document.getElementById('start').value=d.toISOString().slice(0,16)}}renderQs();renderQuiz()}catch(e){}}
async function results(){try{let r=await fetch('/api/results',{cache:'no-store'});let d=await r.json();answers=d.answers||[];let total=answers.length;let scores=answers.map(a=>a.total?Math.round(Number(a.score||0)/Number(a.total)*100):0);document.getElementById('n').textContent=fa(total);document.getElementById('avg').textContent=fa(scores.length?Math.round(scores.reduce((a,b)=>a+b,0)/scores.length):0)+'٪';document.getElementById('best').textContent=fa(scores.length?Math.max(...scores):0)+'٪';document.getElementById('results').innerHTML=total?'<table><tr><th>نام</th><th>نمره</th><th>درصد</th><th>زمان</th></tr>'+answers.map((a,i)=>'<tr><td>'+esc(a.name||'بدون نام')+'</td><td>'+fa(a.score??'—')+' / '+fa(a.total??qs.length)+'</td><td>'+fa(scores[i])+'٪</td><td>'+ (a.submittedAt?new Date(a.submittedAt).toLocaleString('fa-IR'):'—')+'</td></tr>').join('')+'</table>':'<div class="empty">هنوز پاسخی ثبت نشده است.</div>'}catch(e){document.getElementById('results').innerHTML='<div class="empty">نتایج در دسترس نیست.</div>'}}
function copyLink(){navigator.clipboard.writeText(location.origin+'/student').then(()=>msg('لینک دانش‌آموز کپی شد.')).catch(()=>msg('کپی خودکار انجام نشد.',false))}
async function refresh(){await loadQuiz();await results();msg('اطلاعات به‌روز شد.')}
generate(10);refresh();setInterval(results,10000);
</script></body></html>
