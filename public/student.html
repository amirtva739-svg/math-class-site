<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>آزمون ریاضی | دانش‌آموز</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f4f7fb;color:#172033}.wrap{max-width:900px;margin:auto;padding:24px 16px 50px}.card{background:#fff;border:1px solid #e3e8f0;border-radius:18px;padding:24px;margin-bottom:18px;box-shadow:0 8px 25px rgba(24,39,75,.06)}h1,h2{margin-top:0}.muted{color:#687386;line-height:1.8}.field{max-width:500px}.field label{display:block;font-weight:700;margin-bottom:8px}input{width:100%;padding:13px 14px;border:1px solid #ccd4df;border-radius:10px;font-size:16px;outline:none}input:focus{border-color:#4c7cf0;box-shadow:0 0 0 3px rgba(76,124,240,.12)}button{border:0;border-radius:10px;padding:12px 18px;font-size:15px;font-weight:700;cursor:pointer;background:#2864e8;color:#fff}button.secondary{background:#e9eef7;color:#25334a}button:disabled{opacity:.55;cursor:not-allowed}.hidden{display:none!important}.status{padding:14px 16px;border-radius:12px;margin-top:16px;line-height:1.8;background:#eef4ff;border:1px solid #d8e5ff}.status.warning{background:#fff8e8;border-color:#f2dfaa}.status.success{background:#ecf9f0;border-color:#ccebd5}.status.error{background:#fff0f0;border-color:#f0caca}.quiz-header{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:20px}.timer{min-width:150px;text-align:center;background:#172033;color:#fff;border-radius:14px;padding:12px 18px}.timer small{display:block;opacity:.75;font-size:12px}.timer strong{display:block;font-size:25px;direction:ltr}.question{border:1px solid #e2e7ef;border-radius:15px;padding:18px;margin-bottom:14px;background:#fbfcfe}.question-number{color:#5f6d83;font-size:14px}.expression{font-size:27px;font-weight:800;direction:ltr;text-align:center;margin:10px 0 16px}.answer-input{max-width:240px;margin:auto;display:block;text-align:center;direction:ltr;font-size:20px}.result-score{text-align:center;font-size:46px;font-weight:900;margin:10px 0}.result-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}.result-box{background:#f5f7fb;border-radius:12px;padding:16px;text-align:center}.result-box strong{display:block;font-size:24px;margin-top:4px}.footer-note{text-align:center;color:#7a8494;font-size:13px;margin-top:18px}@media(max-width:600px){.card{padding:18px}.result-grid{grid-template-columns:1fr}.timer{width:100%}}
</style></head>
<body><div class="wrap">
<section id="introCard" class="card"><h1>آزمون ریاضی</h1><p class="muted">نام و نام خانوادگی خود را وارد کنید و وضعیت آزمون را ببینید.</p>
<div class="field"><label for="studentName">نام و نام خانوادگی</label><input id="studentName" maxlength="80" autocomplete="name" placeholder="مثلاً: علی رضایی"></div>
<div id="quizStatus" class="status">در حال دریافت اطلاعات آزمون...</div>
<div style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap"><button id="startButton" disabled>ورود به آزمون</button><button id="refreshButton" class="secondary">بررسی دوباره</button></div></section>
<section id="quizCard" class="card hidden"><div class="quiz-header"><div><h2 id="quizTitle">آزمون</h2><div id="questionCount" class="muted"></div></div><div class="timer"><small>زمان باقی‌مانده</small><strong id="timer">--:--</strong></div></div>
<form id="quizForm"><div id="questions"></div><button id="submitButton" type="submit">ثبت آزمون</button></form><p class="footer-note">بعد از ثبت آزمون، امکان تغییر پاسخ‌ها وجود ندارد.</p></section>
<section id="resultCard" class="card hidden"><h2>آزمون ثبت شد</h2><p id="resultMessage" class="muted"></p><div class="result-score" id="scoreText">0 / 0</div><div class="result-grid"><div class="result-box">درست<strong id="correctText">0</strong></div><div class="result-box">غلط<strong id="wrongText">0</strong></div><div class="result-box">بدون پاسخ<strong id="blankText">0</strong></div></div></section>
</div><script>
const $=id=>document.getElementById(id);let quiz=null,timerInterval=null,hasSubmitted=false,quizStarted=false;
function fa(n){return String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d])}function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
function dateText(v){const d=new Date(v);return Number.isNaN(d.getTime())?'':new Intl.DateTimeFormat('fa-IR',{dateStyle:'medium',timeStyle:'short'}).format(d)}
function startDate(){if(!quiz?.startTime)return null;const d=new Date(quiz.startTime);return Number.isNaN(d.getTime())?null:d}function duration(){const n=Number(quiz?.duration);return (Number.isFinite(n)&&n>0?n:20)*60000}
function status(msg,type=''){$('quizStatus').className='status'+(type?' '+type:'');$('quizStatus').innerHTML=msg}
async function loadQuiz(){ $('startButton').disabled=true;status('در حال دریافت اطلاعات آزمون...');try{const r=await fetch('/api/quiz',{cache:'no-store'});if(!r.ok)throw Error();quiz=await r.json();if(!quiz){status('در حال حاضر آزمونی منتشر نشده است.','warning');return}if(!Array.isArray(quiz.questions)||!quiz.questions.length){status('آزمون منتشر شده، اما هنوز سؤالی ندارد.','warning');return}updateStatus()}catch(e){console.error(e);status('دریافت اطلاعات آزمون انجام نشد. اتصال اینترنت و آدرس سایت را بررسی کنید.','error')}}
function updateStatus(){if(!quiz)return;const s=startDate(),now=new Date();if(s&&now<s){status(`<strong>${esc(quiz.title||'آزمون ریاضی')}</strong><br>آزمون هنوز شروع نشده است.<br>زمان شروع: <strong>${esc(dateText(s))}</strong>`,'warning');$('startButton').disabled=true;$('startButton').textContent='هنوز شروع نشده';return}const end=s?new Date(s.getTime()+duration()):null;if(end&&now>=end){status('زمان این آزمون به پایان رسیده است.','error');$('startButton').disabled=true;$('startButton').textContent='آزمون تمام شده';return}status(`<strong>${esc(quiz.title||'آزمون ریاضی')}</strong><br>تعداد سؤال: ${fa(quiz.questions.length)}<br>مدت آزمون: ${fa(Number(quiz.duration)||20)} دقیقه`,'success');$('startButton').disabled=false;$('startButton').textContent='ورود به آزمون'}
function startQuiz(){if(!quiz||quizStarted)return;const name=$('studentName').value.trim();if(!name){$('studentName').focus();status('لطفاً ابتدا نام و نام خانوادگی خود را وارد کنید.','error');return}const s=startDate(),now=new Date();if(s&&now<s){updateStatus();return}const end=s?new Date(s.getTime()+duration()):new Date(now.getTime()+duration());if(now>=end){updateStatus();return}quizStarted=true;$('introCard').classList.add('hidden');$('quizCard').classList.remove('hidden');$('quizTitle').textContent=quiz.title||'آزمون ریاضی';$('questionCount').textContent=`${fa(quiz.questions.length)} سؤال`;$('questions').innerHTML=quiz.questions.map((q,i)=>`<div class="question"><div class="question-number">سؤال ${fa(i+1)}</div><div class="expression">${esc(q.a)} × ${esc(q.b)} = ؟</div><input class="answer-input" type="number" inputmode="numeric" data-index="${i}" aria-label="پاسخ سؤال ${i+1}" autocomplete="off"></div>`).join('');quiz._endTime=end;updateTimer();timerInterval=setInterval(updateTimer,1000)}
function updateTimer(){if(!quiz?._endTime||hasSubmitted)return;const rem=quiz._endTime-Date.now();if(rem<=0){$('timer').textContent='۰۰:۰۰';submitQuiz(true);return}const sec=Math.floor(rem/1000),m=Math.floor(sec/60),s=sec%60;$('timer').textContent=`${fa(String(m).padStart(2,'0'))}:${fa(String(s).padStart(2,'0'))}`}
async function submitQuiz(auto=false){if(hasSubmitted||!quiz)return;hasSubmitted=true;clearInterval(timerInterval);$('submitButton').disabled=true;const inputs=[...document.querySelectorAll('.answer-input')];let correct=0,blank=0;const answers=quiz.questions.map((q,i)=>{const raw=inputs[i]?.value.trim()||'';const answer=raw===''?null:Number(raw);const ok=answer!==null&&answer===Number(q.answer);if(answer===null)blank++;if(ok)correct++;return{questionIndex:i,answer,correct:ok}});const total=quiz.questions.length,wrong=total-correct-blank;const payload={name:$('studentName').value.trim(),quizTitle:quiz.title||'آزمون ریاضی',answers,score:correct,correct,wrong,blank,total};try{const r=await fetch('/api/answers',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});if(!r.ok)throw Error();$('quizCard').classList.add('hidden');$('resultCard').classList.remove('hidden');$('scoreText').textContent=`${fa(correct)} / ${fa(total)}`;$('correctText').textContent=fa(correct);$('wrongText').textContent=fa(wrong);$('blankText').textContent=fa(blank);$('resultMessage').textContent=auto?'زمان آزمون تمام شد و پاسخ‌ها به‌صورت خودکار ثبت شدند.':'پاسخ‌های شما با موفقیت برای معلم ارسال شد.'}catch(e){console.error(e);hasSubmitted=false;$('submitButton').disabled=false;alert('ثبت آزمون انجام نشد. اتصال اینترنت را بررسی کنید و دوباره تلاش کنید.')}}
$('startButton').onclick=startQuiz;$('refreshButton').onclick=loadQuiz;$('quizForm').onsubmit=e=>{e.preventDefault();if(confirm('آیا مطمئن هستید می‌خواهید آزمون را ثبت کنید؟ بعد از ثبت امکان تغییر پاسخ‌ها وجود ندارد.'))submitQuiz(false)};setInterval(()=>{if(quiz&&!quizStarted)updateStatus()},5000);loadQuiz();
</script></body></html>
