<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>پنل معلم</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Tahoma,Arial,sans-serif;
  background:#f4f7fb;
  color:#172033;
}

.container{
  max-width:1100px;
  margin:30px auto;
  padding:0 18px;
}

.header{
  background:linear-gradient(135deg,#5b5ce2,#7b61ff);
  color:white;
  border-radius:22px;
  padding:28px;
  margin-bottom:20px;
  box-shadow:0 10px 30px rgba(70,70,150,.15);
}

.header h1{
  margin:0 0 8px;
  font-size:28px;
}

.header p{
  margin:0;
  opacity:.9;
}

.card{
  background:white;
  border-radius:18px;
  padding:22px;
  margin-bottom:20px;
  box-shadow:0 5px 20px rgba(0,0,0,.06);
}

.card h2{
  margin-top:0;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
}

.field label{
  display:block;
  margin-bottom:7px;
  font-weight:bold;
}

input,
select,
textarea{
  width:100%;
  padding:12px;
  border:1px solid #dce1eb;
  border-radius:10px;
  font-family:inherit;
  font-size:15px;
}

textarea{
  min-height:90px;
  resize:vertical;
}

button{
  border:0;
  border-radius:11px;
  padding:11px 17px;
  font-family:inherit;
  font-size:14px;
  cursor:pointer;
}

.primary{
  background:#5b5ce2;
  color:white;
}

.green{
  background:#16a36b;
  color:white;
}

.blue{
  background:#1685d8;
  color:white;
}

.gray{
  background:#edf0f5;
  color:#273247;
}

.red{
  background:#e5484d;
  color:white;
}

.buttons{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:18px;
}

.msg{
  padding:12px;
  border-radius:10px;
  margin-bottom:15px;
  display:none;
}

.msg.ok{
  background:#e5f8ef;
  color:#087443;
}

.msg.err{
  background:#ffe8e8;
  color:#a61919;
}

.q{
  border:1px solid #e1e5ed;
  border-radius:15px;
  padding:18px;
  margin-bottom:15px;
  background:#fafbfe;
}

.qtop{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.qtype{
  display:inline-block;
  padding:5px 9px;
  border-radius:8px;
  font-size:12px;
  margin-right:7px;
}

.qtype.mul{
  background:#e8efff;
  color:#315fc5;
}

.qtype.geo{
  background:#fff0d8;
  color:#a66000;
}

.qinputs{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.qinputs.two{
  grid-template-columns:1fr 1fr;
}

.option-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin-top:12px;
}

.option{
  background:white;
  padding:12px;
  border-radius:10px;
  border:1px solid #e1e5ed;
}

.option label{
  font-size:12px;
  display:block;
  margin-bottom:5px;
}

.empty{
  padding:25px;
  text-align:center;
  color:#777;
}

.status{
  display:inline-block;
  padding:8px 12px;
  border-radius:10px;
  font-weight:bold;
}

.status.green{
  background:#dcf8ea;
  color:#087443;
}

.status.yellow{
  background:#fff1cc;
  color:#8a6200;
}

.status.gray{
  background:#edf0f5;
  color:#596273;
}

.info{
  line-height:2;
  margin-top:15px;
}

.linkbox{
  background:#f3f5ff;
  padding:14px;
  border-radius:12px;
  word-break:break-all;
  margin-top:10px;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:15px;
}

th,
td{
  padding:12px;
  border-bottom:1px solid #e5e7ec;
  text-align:right;
}

th{
  background:#f5f6fa;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
}

.stat{
  background:#f7f8fc;
  padding:18px;
  border-radius:15px;
  text-align:center;
}

.stat b{
  display:block;
  font-size:25px;
  margin-top:7px;
}

@media(max-width:700px){

  .grid,
  .qinputs,
  .qinputs.two,
  .option-grid,
  .stats{
    grid-template-columns:1fr;
  }

}

</style>

</head>


<body>

<div class="container">

  <div class="header">

    <h1>پنل معلم</h1>

    <p>
      ساخت آزمون ریاضی پایه چهارم و مشاهده نتایج دانش‌آموزان
    </p>

  </div>


  <div id="msg" class="msg"></div>


  <!-- ================================================= -->
  <!-- مشخصات آزمون -->
  <!-- ================================================= -->

  <div class="card">

    <h2>مشخصات آزمون</h2>

    <div class="grid">

      <div class="field">

        <label>
          عنوان آزمون
        </label>

        <input
          id="title"
          value="آزمون ریاضی پایه چهارم"
        >

      </div>


      <div class="field">

        <label>
          مدت آزمون به دقیقه
        </label>

        <input
          id="duration"
          type="number"
          value="15"
          min="1"
        >

      </div>


      <div class="field">

        <label>
          زمان شروع
        </label>

        <input
          id="start"
          type="datetime-local"
        >

      </div>

    </div>

  </div>


  <!-- ================================================= -->
  <!-- ساخت سؤال -->
  <!-- ================================================= -->

  <div class="card">

    <h2>ساخت سؤال</h2>

    <div class="buttons">

      <button
        class="primary"
        onclick="generateMultiplication(10)"
      >
        ساخت ۱۰ سؤال ضرب
      </button>


      <button
        class="blue"
        onclick="generateGeometry(10)"
      >
        ساخت ۱۰ سؤال هندسه
      </button>


      <button
        class="gray"
        onclick="addMultiplication()"
      >
        + سؤال ضرب
      </button>


      <button
        class="gray"
        onclick="addGeometry()"
      >
        + سؤال هندسه
      </button>

    </div>

  </div>


  <!-- ================================================= -->
  <!-- سؤال‌ها -->
  <!-- ================================================= -->

  <div class="card">

    <h2>
      سؤال‌های آزمون
    </h2>

    <div id="questions"></div>

  </div>


  <!-- ================================================= -->
  <!-- انتشار -->
  <!-- ================================================= -->

  <div class="card">

    <h2>انتشار آزمون</h2>

    <div class="buttons">

      <button
        class="green"
        onclick="publish()"
      >
        انتشار آزمون
      </button>


      <button
        class="gray"
        onclick="refresh()"
      >
        بروزرسانی
      </button>

    </div>


    <div class="info">

      <div>
        وضعیت:
        <span id="state">
          <span class="status gray">
            آزمونی منتشر نشده
          </span>
        </span>
      </div>


      <div id="info"></div>


      <div>

        <b>
          لینک دانش‌آموز:
        </b>

        <div
          class="linkbox"
          id="studentLink"
        >
          پس از انتشار نمایش داده می‌شود.
        </div>

      </div>

    </div>

  </div>


  <!-- ================================================= -->
  <!-- نتایج -->
  <!-- ================================================= -->

  <div class="card">

    <h2>
      نتایج دانش‌آموزان
    </h2>


    <div class="stats">

      <div class="stat">
        تعداد شرکت‌کنندگان
        <b id="n">۰</b>
      </div>


      <div class="stat">
        میانگین
        <b id="avg">۰٪</b>
      </div>


      <div class="stat">
        بالاترین درصد
        <b id="best">۰٪</b>
      </div>

    </div>


    <div id="results">
      <div class="empty">
        هنوز پاسخی ثبت نشده است.
      </div>
    </div>

  </div>

</div>


<script>

let qs = [];
let quiz = null;


// =====================================================
// ابزارها
// =====================================================

const fa = x =>
  String(x).replace(
    /\d/g,
    d => "۰۱۲۳۴۵۶۷۸۹"[d]
  );


const esc = x =>
  String(x ?? "").replace(
    /[&<>"']/g,
    c => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[c])
  );


function msg(text, ok = true){

  const el =
    document.getElementById("msg");

  el.textContent = text;

  el.className =
    "msg " + (ok ? "ok" : "err");

  el.style.display = "block";

  setTimeout(() => {

    el.style.display = "none";

  }, 3500);
}


// =====================================================
// ساخت سؤال‌های ضرب
// =====================================================

function generateMultiplication(n){

  qs = [];

  const used = new Set();


  while(qs.length < n){

    const a =
      Math.floor(Math.random() * 9) + 2;

    const b =
      Math.floor(Math.random() * 9) + 2;

    const key =
      a + "x" + b;


    if(used.has(key)){
      continue;
    }


    used.add(key);


    qs.push({

      type:"multiplication",

      a,
      b,

      answer:
        a * b

    });

  }


  renderQs();

  msg("۱۰ سؤال ضرب ساخته شد.");
}


// =====================================================
// سؤال ضرب
// =====================================================

function addMultiplication(){

  qs.push({

    type:"multiplication",

    a:3,

    b:7,

    answer:21

  });


  renderQs();
}


// =====================================================
// بانک سؤال هندسه پایه چهارم
// =====================================================

const geometryBank = [

  {
    questionText:
      "کدام زاویه، زاویه راست است؟",

    options:[
      "زاویه ۴۵ درجه",
      "زاویه ۹۰ درجه",
      "زاویه ۱۲۰ درجه",
      "زاویه ۱۸۰ درجه"
    ],

    answerIndex:1
  },


  {
    questionText:
      "زاویه‌ای که از زاویه راست کوچک‌تر باشد چه نام دارد؟",

    options:[
      "زاویه تند",
      "زاویه باز",
      "زاویه نیم‌صفحه",
      "زاویه کامل"
    ],

    answerIndex:0
  },


  {
    questionText:
      "زاویه‌ای که از زاویه راست بزرگ‌تر و از ۱۸۰ درجه کوچک‌تر باشد چه نام دارد؟",

    options:[
      "زاویه تند",
      "زاویه راست",
      "زاویه باز",
      "زاویه کامل"
    ],

    answerIndex:2
  },


  {
    questionText:
      "کدام شکل چهار ضلع دارد؟",

    options:[
      "مثلث",
      "مربع",
      "دایره",
      "پنج‌ضلعی"
    ],

    answerIndex:1
  },


  {
    questionText:
      "مربع چند ضلع برابر دارد؟",

    options:[
      "۲ ضلع",
      "۳ ضلع",
      "۴ ضلع",
      "۵ ضلع"
    ],

    answerIndex:2
  },


  {
    questionText:
      "محیط مربعی با ضلع ۵ سانتی‌متر چند سانتی‌متر است؟",

    options:[
      "۱۰ سانتی‌متر",
      "۱۵ سانتی‌متر",
      "۲۰ سانتی‌متر",
      "۲۵ سانتی‌متر"
    ],

    answerIndex:2
  },


  {
    questionText:
      "مساحت مستطیلی با طول ۶ و عرض ۳ سانتی‌متر چقدر است؟",

    options:[
      "۹ سانتی‌متر مربع",
      "۱۲ سانتی‌متر مربع",
      "۱۸ سانتی‌متر مربع",
      "۲۴ سانتی‌متر مربع"
    ],

    answerIndex:2
  },


  {
    questionText:
      "کدام شکل سه ضلع دارد؟",

    options:[
      "مربع",
      "مستطیل",
      "مثلث",
      "ذوزنقه"
    ],

    answerIndex:2
  },


  {
    questionText:
      "دو خطی که هیچ‌وقت یکدیگر را قطع نمی‌کنند چه نام دارند؟",

    options:[
      "عمود",
      "موازی",
      "منحنی",
      "متقاطع"
    ],

    answerIndex:1
  },


  {
    questionText:
      "دو خطی که با زاویه ۹۰ درجه یکدیگر را قطع کنند چه نام دارند؟",

    options:[
      "موازی",
      "عمود",
      "هم‌جهت",
      "منحنی"
    ],

    answerIndex:1
  },


  {
    questionText:
      "محیط مستطیلی با طول ۸ و عرض ۳ سانتی‌متر چند است؟",

    options:[
      "۱۱ سانتی‌متر",
      "۱۶ سانتی‌متر",
      "۲۲ سانتی‌متر",
      "۲۴ سانتی‌متر"
    ],

    answerIndex:2
  },


  {
    questionText:
      "مساحت مربعی با ضلع ۴ سانتی‌متر چقدر است؟",

    options:[
      "۸ سانتی‌متر مربع",
      "۱۲ سانتی‌متر مربع",
      "۱۶ سانتی‌متر مربع",
      "۲۰ سانتی‌متر مربع"
    ],

    answerIndex:2
  }

];


// =====================================================
// ساخت سؤال هندسه تصادفی
// =====================================================

function generateGeometry(n){

  qs = [];

  const used = new Set();


  while(qs.length < n){

    const index =
      Math.floor(
        Math.random() *
        geometryBank.length
      );


    if(used.has(index)){
      continue;
    }


    used.add(index);


    const item =
      geometryBank[index];


    qs.push({

      type:"geometry",

      questionText:
        item.questionText,

      options:
        [...item.options],

      answerIndex:
        item.answerIndex

    });

  }


  renderQs();

  msg("۱۰ سؤال هندسه ساخته شد.");
}


// =====================================================
// سؤال هندسه دستی
// =====================================================

function addGeometry(){

  qs.push({

    type:"geometry",

    questionText:
      "کدام شکل چهار ضلع دارد؟",

    options:[
      "مثلث",
      "مربع",
      "دایره",
      "پنج‌ضلعی"
    ],

    answerIndex:1

  });


  renderQs();
}


// =====================================================
// حذف
// =====================================================

function removeQuestion(i){

  if(qs.length <= 1){

    msg(
      "حداقل یک سؤال لازم است.",
      false
    );

    return;
  }


  qs.splice(i,1);

  renderQs();
}


// =====================================================
// تغییر مقدار سؤال ضرب
// =====================================================

function updateMul(i,key,value){

  qs[i][key] =
    Number(value);


  if(key === "a" || key === "b"){

    qs[i].answer =
      Number(qs[i].a) *
      Number(qs[i].b);

  }


  renderQs();
}


// =====================================================
// تغییر متن سؤال هندسه
// =====================================================

function updateGeoText(i,value){

  qs[i].questionText =
    value;
}


// =====================================================
// تغییر گزینه هندسه
// =====================================================

function updateGeoOption(i,index,value){

  qs[i].options[index] =
    value;
}


// =====================================================
// تغییر پاسخ صحیح هندسه
// =====================================================

function updateGeoAnswer(i,value){

  qs[i].answerIndex =
    Number(value);
}


// =====================================================
// نمایش سؤال‌ها
// =====================================================

function renderQs(){

  const box =
    document.getElementById("questions");


  if(!qs.length){

    box.innerHTML =
      `
      <div class="empty">
        هنوز سؤالی ندارید.
      </div>
      `;

    return;
  }


  box.innerHTML =
    qs.map((q,i) => {

      // ===============================================
      // ضرب
      // ===============================================

      if(q.type === "multiplication"){

        return `

        <div class="q">

          <div class="qtop">

            <div>

              <b>
                سؤال ${fa(i+1)}
              </b>

              <span class="qtype mul">
                ضرب
              </span>

            </div>


            <button
              class="red"
              onclick="removeQuestion(${i})"
            >
              حذف
            </button>

          </div>


          <div class="qinputs">

            <div>

              <label>
                عدد اول
              </label>

              <input
                type="number"
                value="${q.a}"
                onchange="
                  updateMul(
                    ${i},
                    'a',
                    this.value
                  )
                "
              >

            </div>


            <div>

              <label>
                عدد دوم
              </label>

              <input
                type="number"
                value="${q.b}"
                onchange="
                  updateMul(
                    ${i},
                    'b',
                    this.value
                  )
                "
              >

            </div>


            <div>

              <label>
                پاسخ صحیح
              </label>

              <input
                type="number"
                value="${q.answer}"
                onchange="
                  qs[${i}].answer =
                  Number(this.value)
                "
              >

            </div>

          </div>

        </div>

        `;
      }


      // ===============================================
      // هندسه
      // ===============================================

      return `

      <div class="q">

        <div class="qtop">

          <div>

            <b>
              سؤال ${fa(i+1)}
            </b>

            <span class="qtype geo">
              هندسه
            </span>

          </div>


          <button
            class="red"
            onclick="removeQuestion(${i})"
          >
            حذف
          </button>

        </div>


        <div>

          <label>
            متن سؤال
          </label>

          <textarea
            onchange="
              updateGeoText(
                ${i},
                this.value
              )
            "
          >${esc(q.questionText)}</textarea>

        </div>


        <div class="option-grid">

          ${q.options.map((option,index) => `

            <div class="option">

              <label>
                گزینه ${fa(index+1)}
                ${index === q.answerIndex
                  ? " — پاسخ صحیح"
                  : ""}
              </label>

              <input
                value="${esc(option)}"
                onchange="
                  updateGeoOption(
                    ${i},
                    ${index},
                    this.value
                  )
                "
              >

            </div>

          `).join("")}

        </div>


        <div
          style="
            margin-top:15px;
            max-width:300px;
          "
        >

          <label>
            گزینه صحیح
          </label>

          <select
            onchange="
              updateGeoAnswer(
                ${i},
                this.value
              )
            "
          >

            ${q.options.map((_,index) => `

              <option
                value="${index}"
                ${index === q.answerIndex
                  ? "selected"
                  : ""}
              >
                گزینه ${fa(index+1)}
              </option>

            `).join("")}

          </select>

        </div>

      </div>

      `;

    }).join("");
}


// =====================================================
// Payload
// =====================================================

function payload(){

  const raw =
    document.getElementById("start").value;


  return {

    title:
      document
        .getElementById("title")
        .value
        .trim()
      ||
      "آزمون ریاضی پایه چهارم",


    durationMinutes:
      Number(
        document.getElementById("duration").value
      ) || 15,


    startAt:
      raw
        ? new Date(raw).toISOString()
        : null,


    questions:qs
  };
}


// =====================================================
// انتشار
// =====================================================

async function publish(){

  if(!qs.length){

    msg(
      "اول سؤال بساز.",
      false
    );

    return;
  }


  try{

    const response =
      await fetch(
        "/api/quiz",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify(payload())
        }
      );


    const data =
      await response.json();


    if(!response.ok){

      throw new Error(
        data.error ||
        "خطا در ذخیره آزمون"
      );
    }


    quiz = data;


    msg(
      "آزمون با موفقیت منتشر شد."
    );


    renderQuiz();

    await results();

  }

  catch(error){

    msg(
      error.message ||
      "ذخیره آزمون انجام نشد.",
      false
    );
  }
}


// =====================================================
// نمایش وضعیت آزمون
// =====================================================

function renderQuiz(){

  if(!quiz){

    document.getElementById("state")
      .innerHTML =
      `
      <span class="status gray">
        آزمونی منتشر نشده
      </span>
      `;


    document.getElementById("info")
      .textContent = "";


    document.getElementById("studentLink")
      .textContent =
      "پس از انتشار نمایش داده می‌شود.";

    return;
  }


  const start =
    quiz.startAt
      ? new Date(quiz.startAt)
      : null;


  const end =
    start
      ? new Date(
          start.getTime() +
          Number(
            quiz.durationMinutes || 15
          ) *
          60000
        )
      : null;


  const now =
    new Date();


  let text;


  if(start && now < start){

    text =
      "زمان‌بندی شده";

  }

  else if(
    end &&
    now > end
  ){

    text =
      "پایان‌یافته";

  }

  else{

    text =
      "فعال";
  }


  const cls =
    text === "فعال"
      ? "green"
      : text === "زمان‌بندی شده"
        ? "yellow"
        : "gray";


  document.getElementById("state")
    .innerHTML =
    `
    <span class="status ${cls}">
      ${text}
    </span>
    `;


  document.getElementById("info")
    .innerHTML =
    `
    عنوان:
    <b>
      ${esc(quiz.title)}
    </b>

    <br>

    تعداد سؤال:
    ${fa(quiz.questions?.length || 0)}

    <br>

    مدت:
    ${fa(quiz.durationMinutes || 15)}
    دقیقه

    <br>

    شروع:
    ${
      start
        ? start.toLocaleString("fa-IR")
        : "فوری"
    }
    `;


  document.getElementById("studentLink")
    .textContent =
    location.origin +
    "/student";
}


// =====================================================
// دریافت آزمون
// =====================================================

async function loadQuiz(){

  try{

    const response =
      await fetch(
        "/api/quiz",
        {
          cache:"no-store"
        }
      );


    if(!response.ok){
      throw new Error();
    }


    quiz =
      await response.json();


    if(
      quiz &&
      Array.isArray(quiz.questions)
    ){

      qs =
        quiz.questions.map(q => {

          if(
            q.type === "geometry"
          ){

            return {

              type:"geometry",

              questionText:
                q.questionText || "",

              options:
                Array.isArray(q.options)
                  ? [...q.options]
                  : [],

              answerIndex:
                Number(q.answerIndex) || 0
            };
          }


          return {

            type:"multiplication",

            a:Number(q.a),

            b:Number(q.b),

            answer:Number(q.answer)
          };

        });


      document.getElementById("title")
        .value =
        quiz.title || "";


      document.getElementById("duration")
        .value =
        quiz.durationMinutes || 15;


      if(quiz.startAt){

        let d =
          new Date(quiz.startAt);


        d =
          new Date(
            d.getTime() -
            d.getTimezoneOffset() *
            60000
          );


        document.getElementById("start")
          .value =
          d.toISOString()
           .slice(0,16);
      }

    }


    renderQs();

    renderQuiz();

  }

  catch(error){

    renderQs();
  }
}


// =====================================================
// نتایج
// =====================================================

async function results(){

  try{

    const response =
      await fetch(
        "/api/results",
        {
          cache:"no-store"
        }
      );


    const data =
      await response.json();


    const answers =
      data.answers || [];


    const total =
      answers.length;


    const scores =
      answers.map(a =>
        a.total
          ? Math.round(
              Number(a.score || 0) /
              Number(a.total) *
              100
            )
          : 0
      );


    document.getElementById("n")
      .textContent =
      fa(total);


    document.getElementById("avg")
      .textContent =
      fa(
        scores.length
          ? Math.round(
              scores.reduce(
                (a,b) => a+b,
                0
              ) /
              scores.length
            )
          : 0
      ) + "٪";


    document.getElementById("best")
      .textContent =
      fa(
        scores.length
          ? Math.max(...scores)
          : 0
      ) + "٪";


    document.getElementById("results")
      .innerHTML =
      total

        ? `

        <table>

          <tr>

            <th>
              نام
            </th>

            <th>
              نمره
            </th>

            <th>
              درصد
            </th>

            <th>
              زمان
            </th>

          </tr>


          ${answers.map((a,i) => `

            <tr>

              <td>
                ${esc(
                  a.name ||
                  "بدون نام"
                )}
              </td>


              <td>
                ${fa(a.score ?? "—")}
                /
                ${fa(a.total ?? qs.length)}
              </td>


              <td>
                ${fa(scores[i])}
                ٪
              </td>


              <td>
                ${
                  a.submittedAt
                    ? new Date(
                        a.submittedAt
                      ).toLocaleString("fa-IR")
                    : "—"
                }
              </td>

            </tr>

          `).join("")}

        </table>

        `

        : `

        <div class="empty">
          هنوز پاسخی ثبت نشده است.
        </div>

        `;

  }

  catch(error){

    document.getElementById("results")
      .innerHTML =
      `
      <div class="empty">
        نتایج در دسترس نیست.
      </div>
      `;
  }
}


// =====================================================
// بروزرسانی
// =====================================================

async function refresh(){

  await loadQuiz();

  await results();

  msg(
    "اطلاعات به‌روز شد."
  );
}


// =====================================================
// شروع
// =====================================================

generateMultiplication(10);

refresh();

setInterval(
  results,
  10000
);

</script>
