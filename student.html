<!doctype html><html lang="fa"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>آزمون دانش‌آموز</title><link rel="stylesheet" href="/style.css"></head><body><div class="wrap"><div class="top"><div><div class="brand" id="title">آزمون ریاضی</div><div class="muted">ضرب پایه چهارم</div></div><div class="pill" id="status">در حال بررسی...</div></div><div id="app"></div></div><script>
let quiz,remain,interval; async function init(){quiz=await (await fetch('/api/quiz')).json(); if(!quiz){app.innerHTML='<div class="card"><h3>آزمونی منتشر نشده است</h3><p class="muted">لطفاً از معلم بخواهید آزمون را منتشر کند.</p></div>';return} title.textContent=quiz.title; const start=new Date(quiz.start).getTime(); const now=Date.now(); const end=start+quiz.minutes*60000; if(now<start){app.innerHTML=`<div class="card"><h3>آزمون هنوز شروع نشده</h3><p>زمان شروع: ${new Date(start).toLocaleString('fa-IR')}</p></div>`;return} if(now>=end){app.innerHTML='<div class="card"><h3>زمان آزمون تمام شده است.</h3></div>';return} showForm(); tick(end);}
function showForm(){app.innerHTML=`<div class="card"><div class="field"><label>نام و نام خانوادگی</label><input id="name" placeholder="مثلاً سارا احمدی"></div><div class="timer" id="timer"></div><div id="questions" class="questions">${quiz.questions.map((q,i)=>`<div class="q"><strong>${i+1}) ${q.a} × ${q.b} = ؟</strong><input data-i="${i}" type="number" inputmode="numeric" placeholder="پاسخ"></div>`).join('')}</div><button class="btn" style="margin-top:16px" onclick="submitQuiz()">ثبت پاسخ‌ها</button></div>`}
function tick(end){const t=()=>{remain=end-Date.now();if(remain<=0){clearInterval(interval);submitQuiz(true);return}const s=Math.floor(remain/1000),m=Math.floor(s/60),sec=s%60;timer.textContent=`زمان باقی‌مانده: ${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`};t();interval=setInterval(t,500)}
async function submitQuiz(auto=false){const n=document.getElementById('name').value.trim();if(!n&&!auto){alert('نام خود را وارد کنید.');return}let score=0,answers=[];document.querySelectorAll('[data-i]').forEach(x=>{const i=+x.dataset.i,v=x.value===''?null:+x.value;answers[i]=v;if(v===quiz.questions[i].a*quiz.questions[i].b)score++});await fetch('/api/answers',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n||'بدون نام',score,answers})});clearInterval(interval);app.innerHTML=`<div class="card success"><h2>پاسخ‌ها ثبت شد</h2><p>تعداد پاسخ درست: <b>${score}</b> از <b>${quiz.questions.length}</b></p><p class="muted">نتیجه برای معلم ارسال شد.</p></div>`;status.textContent='ثبت شد'} init();
</script></body></html>
